name: Cloth gown and blouse test
on:
  push:
    paths:
      - "src/game/character/cloth-test-rig.ts"
      - "src/game/avatar.ts"
      - "src/game/fashion.ts"
      - "src/game/lifestyle-types.ts"
      - "src/ui/WardrobeSheet.tsx"
      - "tests/cloth-test-runtime.cjs"
      - "package.json"
      - ".github/workflows/cloth-test.yml"
  workflow_dispatch:
jobs:
  cloth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node tests/cloth-test-runtime.cjs
      - run: npm run build
      # Existing TS errors in face, garment-rig and surface-map precede this
      # experiment; keep their diagnostics visible without blocking cloth QA.
      - name: Repository-wide typecheck (pre-existing issues)
        run: npm run typecheck
        continue-on-error: true
